name: .NET 9 CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup .NET 9 SDK (Preview)
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'  # Ensure .NET 9 Preview is used
        include-prerelease: true # Allow preview SDKs to be used

    - name: Display .NET version (debugging)
      run: dotnet --version

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      run: dotnet test --no-build --verbosity normal
